<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabu — Card Game</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><header><div class="brand">CABU<span>♠</span></div><p>Remember your cards. Outsmart the table.</p></header><section id="lobby" class="panel"><h1>Play Cabu</h1><p class="muted">Play solo against bots or create a room with friends.</p><input id="nickname" maxlength="18" placeholder="Your nickname" autocomplete="nickname"><label for="opponents">Bots to play against</label><select id="opponents"><option value="1">1 bot (2 players total)</option><option value="2">2 bots (3 players total)</option><option value="3" selected>3 bots (4 players total)</option><option value="4">4 bots (5 players total)</option><option value="5">5 bots (6 players total)</option></select><div class="actions"><button id="solo">Play vs bots</button><button id="create" class="secondary">Create online room</button></div><div class="join"><input id="roomCode" maxlength="6" placeholder="Room code"><button id="join" class="secondary">Join room</button></div><p id="message" role="status"></p></section><section id="game" class="hidden"><div class="gamebar"><div>ROOM <strong id="code"></strong></div><button id="copy" class="secondary">Copy invite link</button></div><div class="table"><div id="players" class="players"></div><div class="center"><div class="pile"><small>DISCARD</small><div id="discard" class="playing-card">—</div><small id="deckCount">Deck</small></div><p id="notice"></p><div id="drawn" class="playing-card hidden"></div></div></div><div class="handarea"><h2>Your cards <small id="handHint">Peek at two and remember them.</small></h2><div id="hand" class="hand"></div><div class="actions"><button id="ready" class="hidden">I'm ready</button><button id="start" class="hidden">Start round</button><button id="draw" class="hidden">Draw from deck</button><button id="take" class="hidden secondary">Take discard</button><button id="discardDrawn" class="hidden secondary">Discard drawn card</button><button id="cabu" class="hidden danger">Call Cabu</button><button id="newRound" class="hidden">New round</button></div></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
